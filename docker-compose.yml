services:
  app:
    build: .
    container_name: planning-poker
    ports:
      - "6969:6969"
    restart: unless-stopped
    networks:
      - default
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:6969/api/state"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.planning-poker-web.rule=Host(`businesswife.nl`) || Host(`www.businesswife.nl`)
      - traefik.http.routers.planning-poker-web.entrypoints=web
      - traefik.http.routers.planning-poker-web.middlewares=redirect-to-https@file
      - traefik.http.routers.planning-poker-web.service=planning-poker
      - traefik.http.routers.planning-poker-websecure.rule=Host(`businesswife.nl`) || Host(`www.businesswife.nl`)
      - traefik.http.routers.planning-poker-websecure.entrypoints=websecure
      - traefik.http.routers.planning-poker-websecure.tls=true
      - traefik.http.routers.planning-poker-websecure.tls.certresolver=letsencrypt
      - traefik.http.routers.planning-poker-websecure.service=planning-poker
      - traefik.http.services.planning-poker.loadbalancer.server.port=6969
      - traefik.http.services.planning-poker.loadbalancer.responseforwarding.flushinterval=1ms

networks:
  dokploy-network:
    external: true
